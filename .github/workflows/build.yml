name: Build Windows installer

# Every push to main builds the installer. If package.json has a version that
# has no GitHub release yet, the build is also published as release v<version>,
# which installed apps pick up through the in-app updater.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Is this version already released?
        id: ver
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          V=$(node -p "require('./package.json').version")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if gh release view "v$V" >/dev/null 2>&1; then echo "release=false" >> "$GITHUB_OUTPUT"
          else echo "release=true" >> "$GITHUB_OUTPUT"; fi

      - name: Build and publish release v${{ steps.ver.outputs.version }}
        if: github.event_name == 'push' && steps.ver.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-vite build && npx electron-builder --win --publish always

      - name: Build only
        if: github.event_name != 'push' || steps.ver.outputs.release != 'true'
        run: npm run dist

      - uses: actions/upload-artifact@v4
        with:
          name: AgentHub-Setup
          path: dist/*.exe
